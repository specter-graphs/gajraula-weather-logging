name: Update Weather Data
   # runs every hour, at minute 7
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      WEATHER_LAT: ${{ vars.WEATHER_LAT || '28.8500' }}
      WEATHER_LON: ${{ vars.WEATHER_LON || '78.2333' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch weather + AQI data
        run: python scripts/fetch_weather.py

      - name: Update README
        run: python scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather_log.csv README.md
          git diff --staged --quiet || git commit -m "Auto-update weather data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

